<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Guitarra Master</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Space Grotesk', sans-serif;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md">
    <!-- Header -->
    <div class="text-center mb-8">
      <h1 class="text-4xl font-bold text-white mb-2">Guitarra Master</h1>
      <p class="text-slate-400">Plataforma de Aulas Online</p>
    </div>

    <!-- Login Card -->
    <div class="bg-slate-800 border border-slate-700 rounded-lg shadow-xl p-8">
      <h2 class="text-2xl font-bold text-white mb-6">Acesso do Aluno</h2>

      <form id="loginForm" class="space-y-4">
        <!-- Email Input -->
        <div>
          <label for="email" class="block text-sm font-medium text-slate-300 mb-2">
            E-mail
          </label>
          <input
            type="email"
            id="email"
            name="email"
            required
            class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded text-white placeholder-slate-500 focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500"
            placeholder="seu@email.com"
          >
        </div>

        <!-- Password Input -->
        <div>
          <label for="password" class="block text-sm font-medium text-slate-300 mb-2">
            Senha
          </label>
          <input
            type="password"
            id="password"
            name="password"
            required
            class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded text-white placeholder-slate-500 focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500"
            placeholder="••••••••"
          >
        </div>

        <!-- Error Message -->
        <div id="errorMessage" class="hidden bg-red-900 border border-red-700 text-red-200 px-4 py-3 rounded">
          <p id="errorText"></p>
        </div>

        <!-- Success Message -->
        <div id="successMessage" class="hidden bg-green-900 border border-green-700 text-green-200 px-4 py-3 rounded">
          <p>Login realizado com sucesso! Redirecionando...</p>
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-2 px-4 rounded transition duration-200 disabled:opacity-50 disabled:cursor-not-allowed"
          id="submitBtn"
        >
          Entrar
        </button>
      </form>

      <!-- Links -->
      <div class="mt-6 text-center space-y-2">
        <p class="text-slate-400">
          Não tem conta?
          <a href="/register.html" class="text-orange-500 hover:text-orange-400">
            Criar conta
          </a>
        </p>
        <p class="text-slate-400">
          <a href="/admin-login.html" class="text-slate-500 hover:text-slate-400 text-sm">
            Acesso administrativo
          </a>
        </p>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    const errorMessage = document.getElementById('errorMessage');
    const errorText = document.getElementById('errorText');
    const successMessage = document.getElementById('successMessage');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      // Hide messages
      errorMessage.classList.add('hidden');
      successMessage.classList.add('hidden');

      // Disable submit button
      submitBtn.disabled = true;
      submitBtn.textContent = 'Entrando...';

      try {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        const response = await fetch('/api/auth?action=login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email, password })
        });

        if (!response.ok) {
          const error = await response.json();
          throw new Error(error.error || 'Erro ao fazer login');
        }

        const data = await response.json();

        // Store token in localStorage
        localStorage.setItem('access_token', data.access_token);
        localStorage.setItem('user', JSON.stringify(data.user));

        // Show success message
        successMessage.classList.remove('hidden');

        // Redirect to student dashboard
        setTimeout(() => {
          window.location.href = '/student-dashboard.html';
        }, 1500);
      } catch (error) {
        console.error('Login error:', error);
        errorText.textContent = error.message || 'Erro ao fazer login. Verifique suas credenciais.';
        errorMessage.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Entrar';
      }
    });

    // Check if already logged in
    window.addEventListener('load', () => {
      const token = localStorage.getItem('access_token');
      if (token) {
        window.location.href = '/student-dashboard.html';
      }
    });
  </script>
</body>
</html>
